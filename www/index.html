<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NabungYuk</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --main:#16a34a; --main2:#4ade80; --red:#dc2626; --line:#e5e7ef; }
  html[data-tema=biru] { --main:#2563eb; --main2:#60a5fa; }
  html[data-tema=ungu] { --main:#7c3aed; --main2:#c084fc; }
  html[data-tema=oranye] { --main:#ea580c; --main2:#fbbf24; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f131a; --card:#1a1f2b; --text:#eef0f6; --muted:#98a0b3; --line:#2a3142; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:env(safe-area-inset-top) 16px 90px; }
  h1 { font-size:20px; margin:20px 0 12px; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; border:1px solid var(--line); animation:naik .5s both; }
  .hero { background:linear-gradient(135deg,var(--main),var(--main2)); color:#fff; border:0; }
  .hero .muted { color:rgba(255,255,255,.85); }
  .saldo { font-size:34px; font-weight:800; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:10px; background:rgba(255,255,255,.3); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; background:#fff; width:0; transition:width .6s; }
  input, textarea, select { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:16px; margin-bottom:8px; font-family:inherit; }
  .row, .quick { display:flex; gap:8px; }
  button { flex:1; padding:12px; border:0; border-radius:12px; font-size:16px; font-weight:600; color:#fff; background:var(--main); transition:transform .1s; }
  button:active { transform:scale(.96); }
  button.out { background:var(--red); }
  button.small { flex:none; padding:7px 11px; font-size:13px; background:var(--line); color:var(--muted); }
  .quick { margin-bottom:8px; } .quick button { flex:1; }
  .dots { display:flex; gap:12px; margin:8px 0; }
  .dot { width:34px; height:34px; border-radius:50%; padding:0; flex:none; border:3px solid transparent; }
  .dot.on { border-color:var(--text); }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #chips { display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:4px; }
  .chip { flex:none; padding:9px 15px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:14px; }
  .chip.on { background:var(--main); color:#fff; border-color:transparent; }
  .chart { display:flex; align-items:stretch; gap:8px; height:120px; margin-top:8px; }
  .col { flex:1; display:flex; flex-direction:column; align-items:center; }
  .bw { flex:1; width:100%; display:flex; align-items:flex-end; }
  .bw div { width:100%; border-radius:8px 8px 0 0; background:linear-gradient(var(--main2),var(--main)); transition:height .6s; }
  .lbl { font-size:11px; color:var(--muted); margin-top:4px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); animation:naik .35s both; }
  .item:last-child { border-bottom:0; }
  .item .kiri { flex:1; } .kanan { display:flex; align-items:center; gap:8px; }
  .plus { color:var(--main); font-weight:700; } .minus { color:var(--red); font-weight:700; }
  .foot { text-align:center; margin-top:24px; }
  #banner { display:none; background:#fef3c7; color:#92400e; border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:14px; justify-content:space-between; align-items:center; gap:8px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:150; background:#1d2433; color:#fff; border-radius:14px; padding:12px 14px; display:none; justify-content:space-between; align-items:center; gap:8px; }
  #toast button { background:rgba(255,255,255,.18); color:#fff; padding:6px 12px; font-size:14px; flex:none; }
  #splash, #lock { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--main),var(--main2)); color:#fff; text-align:center; overflow:hidden; }
  #splash { z-index:99; transition:opacity .5s, transform .5s; }
  #splash.hide { opacity:0; transform:scale(1.15); pointer-events:none; }
  #lock { z-index:200; gap:10px; }
  #lock input { width:200px; text-align:center; font-size:28px; letter-spacing:12px; border-radius:16px; }
  #lock button { flex:none; width:200px; background:rgba(255,255,255,.25); }
  .babi { font-size:100px; animation:pantul 1s ease-in-out infinite; }
  #splash h2 { margin:10px 0 4px; font-size:24px; animation:naik .8s .3s both; }
  #splash p { margin:0; opacity:.9; animation:naik .8s .6s both; }
  #splash small { position:absolute; bottom:40px; opacity:.7; }
  .jatuh { position:fixed; top:-40px; z-index:120; pointer-events:none; animation:jatuh 1.4s ease-in forwards; }
  @keyframes naik { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes pantul { 0%,100% { transform:translateY(0) rotate(-6deg); } 50% { transform:translateY(-24px) rotate(6deg); } }
  @keyframes jatuh { to { transform:translateY(115vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="lock">
  <div style="font-size:64px">🔒</div>
  <div>Masukkan PIN</div>
  <input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div id="pinErr" style="min-height:20px"></div>
  <button onclick="bukaKunci()">Buka</button>
</div>

<div id="splash" onclick="tutupSplash()">
  <div class="babi">🐷</div>
  <h2 id="salam"></h2>
  <p>NabungYuk, ayo nabung hari ini!</p>
  <small>Ketuk untuk lanjut</small>
</div>

<h1>🐷 NabungYuk</h1>
<div id="banner"><span id="bannerTeks"></span><button class="small" onclick="tutupBanner()">Tutup</button></div>
<div id="chips"></div>

<div class="card hero">
  <div class="muted" id="sapa">Saldo tabungan</div>
  <div class="saldo" id="saldo">0</div>
  <div class="bar"><div id="prog"></div></div>
  <div class="muted" id="targetInfo">Belum ada target</div>
  <div class="muted" id="totalInfo" style="margin-top:6px"></div>
</div>

<div class="card">
  <div class="quick" id="quick"></div>
  <input id="jumlah" type="number" step="any" inputmode="decimal" placeholder="Jumlah">
  <input id="catatan" type="text" placeholder="Catatan (opsional)">
  <div class="row">
    <button onclick="tambah(1)">+ Nabung</button>
    <button class="out" onclick="tambah(-1)">− Ambil</button>
  </div>
</div>

<div class="card">
  <div class="muted">Grafik nabung 6 bulan terakhir</div>
  <div class="chart" id="chart"></div>
  <div id="stat" style="margin-top:12px"></div>
</div>

<div class="card">
  <div class="head">
    <div class="muted">Riwayat</div>
    <button class="small" id="btnUndo" onclick="urungkan()">↩ Urungkan</button>
  </div>
  <div id="riwayat"></div>
  <button class="small" style="width:100%;margin-top:10px" onclick="reset()">Kosongkan celengan ini</button>
</div>

<div class="card">
  <div class="muted">Celengan ini</div>
  <input id="target" type="number" step="any" inputmode="decimal" placeholder="Target tabungan" style="margin-top:8px">
  <button class="small" style="width:100%;margin-bottom:8px" onclick="setTarget()">Simpan target</button>
  <div class="row" style="margin-bottom:12px">
    <button class="small" onclick="ubahCelengan()">Ubah nama</button>
    <button class="small" onclick="hapusCelengan()">Hapus celengan</button>
  </div>
  <div class="muted">Pengaturan umum</div>
  <input id="nama" type="text" placeholder="Nama panggilan" style="margin-top:8px" onchange="setNama()">
  <select id="cur" onchange="setCur()">
    <option value="IDR">Rupiah (IDR)</option>
    <option value="USD">Dolar AS (USD)</option>
    <option value="EUR">Euro (EUR)</option>
    <option value="SGD">Dolar Singapura (SGD)</option>
    <option value="MYR">Ringgit (MYR)</option>
    <option value="JPY">Yen (JPY)</option>
    <option value="GBP">Poundsterling (GBP)</option>
    <option value="AUD">Dolar Australia (AUD)</option>
  </select>
  <select id="remind" onchange="setRemind()">
    <option value="0">Pengingat: mati</option>
    <option value="1">Pengingat: setiap hari</option>
    <option value="7">Pengingat: setiap minggu</option>
    <option value="30">Pengingat: setiap bulan</option>
  </select>
  <button class="small" id="btnPin" style="width:100%" onclick="aturPin()">Pasang PIN</button>
  <div class="muted" style="margin-top:12px">Tema</div>
  <div class="dots" id="dots"></div>
</div>

<div class="card">
  <div class="muted" style="margin-bottom:6px">Backup data</div>
  <textarea id="backup" rows="3" placeholder="Tekan Ekspor untuk membuat kode backup. Untuk impor, tempel kode di sini."></textarea>
  <div class="row">
    <button class="small" onclick="ekspor()">Ekspor</button>
    <button class="small" onclick="impor()">Impor</button>
  </div>
</div>

<p class="muted foot">NabungYuk v6.7.0 · by naufallovephone</p>
<div id="toast"><span id="toastTeks"></span><button onclick="urungkan()">Urungkan</button></div>

<script>
const KEY = 'celengan-data', UKEY = 'nabungyuk-undo';
const TEMA = [['hijau','#16a34a'],['biru','#2563eb'],['ungu','#7c3aed'],['oranye','#ea580c']];
const CURS = ['IDR','USD','EUR','SGD','MYR','JPY','GBP','AUD'];
const valid = x => x && typeof x.nominal === 'number' && isFinite(x.nominal);
let data = { celengan: [], aktif: 0, tema: 'hijau', nama: '', cur: 'IDR', remind: 0, pin: '' };
try {
  const raw = JSON.parse(localStorage.getItem(KEY));
  if (raw) {
    if (Array.isArray(raw.celengan)) Object.assign(data, raw);
    else {
      data.celengan = [{ id: 1, nama: 'Utama', emoji: '🐷', target: Number(raw.target) || 0, log: Array.isArray(raw.log) ? raw.log : [] }];
      ['tema', 'nama', 'cur', 'remind'].forEach(k => { if (raw[k] !== undefined) data[k] = raw[k]; });
    }
  }
} catch (e) {}
if (!data.celengan.length) data.celengan = [{ id: Date.now(), nama: 'Utama', emoji: '🐷', target: 0, log: [] }];
if (data.aktif >= data.celengan.length || data.aktif < 0) data.aktif = 0;
let undoStack = [];
try { undoStack = (JSON.parse(localStorage.getItem(UKEY)) || []).filter(s => s.indexOf('"celengan"') > -1); } catch (e) {}
let bannerTutup = false, toastTimer = null, tampil = 0;

const $ = id => document.getElementById(id);
const C = () => data.celengan[data.aktif];
const simpan = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
const simpanUndo = () => { try { localStorage.setItem(UKEY, JSON.stringify(undoStack)); } catch (e) {} };
const hitung = log => log.reduce((s, x) => s + x.nominal, 0);
const bulat = n => Math.round(n * 100) / 100;

function fmt(n) {
  try {
    return new Intl.NumberFormat(data.cur === 'IDR' ? 'id-ID' : 'en-US', {
      style: 'currency', currency: data.cur,
      maximumFractionDigits: (data.cur === 'IDR' || data.cur === 'JPY') ? 0 : 2
    }).format(n);
  } catch (e) { return data.cur + ' ' + n; }
}

function snap() {
  undoStack.push(JSON.stringify({ celengan: data.celengan, aktif: data.aktif }));
  if (undoStack.length > 15) undoStack.shift();
  simpanUndo();
}

function toast(teks, ms) {
  $('toastTeks').textContent = teks;
  $('toast').style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, ms || 5000);
}

function urungkan() {
  if (!undoStack.length) return;
  const s = JSON.parse(undoStack.pop());
  data.celengan = s.celengan; data.aktif = s.aktif;
  simpanUndo(); simpan(); render();
  toast('Aksi terakhir dibatalkan', 2500);
}

function animSaldo(to) {
  const from = tampil, t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / 700);
    tampil = bulat(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('saldo').textContent = fmt(tampil);
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}

function hujan(emoji, n) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'jatuh';
    s.textContent = emoji[i % emoji.length];
    s.style.left = Math.random() * 95 + 'vw';
    s.style.animationDelay = Math.random() * 0.5 + 's';
    s.style.fontSize = 18 + Math.random() * 16 + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2200);
  }
}

function cekBanner() {
  const b = $('banner');
  b.style.display = 'none';
  if (!data.remind || bannerTutup) return;
  const semua = [].concat(...data.celengan.map(c => c.log)).filter(x => x.nominal > 0);
  const terakhir = semua.reduce((m, x) => x.waktu > m ? x.waktu : m, 0);
  if (!terakhir) { $('bannerTeks').textContent = '⏰ Kamu belum punya tabungan. Yuk mulai nabung!'; b.style.display = 'flex'; return; }
  const hari = Math.floor((Date.now() - terakhir) / 86400000);
  if (hari >= data.remind) { $('bannerTeks').textContent = '⏰ Sudah ' + hari + ' hari belum nabung. Yuk nabung lagi!'; b.style.display = 'flex'; }
}
function tutupBanner() { bannerTutup = true; $('banner').style.display = 'none'; }

function gambarChart(log) {
  const now = new Date(), bln = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    bln.push({ k: d.getFullYear() * 12 + d.getMonth(), l: d.toLocaleString('id-ID', { month: 'short' }), v: 0 });
  }
  log.forEach(x => {
    if (x.nominal > 0) {
      const d = new Date(x.waktu), k = d.getFullYear() * 12 + d.getMonth();
      const b = bln.find(m => m.k === k);
      if (b) b.v += x.nominal;
    }
  });
  const mx = Math.max(1, ...bln.map(b => b.v));
  const ch = $('chart'); ch.innerHTML = '';
  bln.forEach(b => {
    const col = document.createElement('div'); col.className = 'col';
    const bw = document.createElement('div'); bw.className = 'bw';
    const bar = document.createElement('div');
    bar.style.height = Math.max(4, b.v / mx * 100) + '%';
    bar.style.opacity = b.v ? 1 : 0.25;
    bar.title = fmt(b.v);
    bw.appendChild(bar);
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = b.l;
    col.append(bw, l); ch.appendChild(col);
  });
}

function render() {
  document.documentElement.dataset.tema = data.tema;
  const c = C(), saldo = hitung(c.log);
  animSaldo(saldo);
  $('sapa').textContent = 'Saldo ' + c.emoji + ' ' + c.nama + (data.nama ? ' · ' + data.nama : '');
  const total = data.celengan.reduce((s, x) => s + hitung(x.log), 0);
  $('totalInfo').textContent = data.celengan.length > 1 ? 'Total semua celengan: ' + fmt(total) : '';
  const pct = c.target > 0 ? Math.min(100, Math.round(saldo / c.target * 100)) : 0;
  $('prog').style.width = pct + '%';
  $('targetInfo').textContent = c.target > 0
    ? pct + '% dari ' + fmt(c.target) + (saldo >= c.target ? ' 🎉 Tercapai!' : ' (kurang ' + fmt(c.target - saldo) + ')')
    : 'Belum ada target';

  $('chips').innerHTML = '';
  data.celengan.forEach((x, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === data.aktif ? ' on' : '');
    b.textContent = x.emoji + ' ' + x.nama;
    b.onclick = () => { data.aktif = i; simpan(); render(); };
    $('chips').appendChild(b);
  });
  const plus = document.createElement('button');
  plus.className = 'chip'; plus.textContent = '＋ Baru'; plus.onclick = tambahCelengan;
  $('chips').appendChild(plus);

  const masuk = c.log.filter(x => x.nominal > 0).reduce((s, x) => s + x.nominal, 0);
  const keluar = c.log.filter(x => x.nominal < 0).reduce((s, x) => s - x.nominal, 0);
  $('stat').innerHTML = '<span class="plus"></span> total masuk<br><span class="minus"></span> total diambil<br><span class="muted"></span>';
  $('stat').children[0].textContent = fmt(masuk);
  $('stat').children[1].textContent = fmt(keluar);
  $('stat').children[2].textContent = c.log.length + ' transaksi';
  gambarChart(c.log);

  $('nama').value = data.nama;
  $('cur').value = data.cur;
  $('remind').value = String(data.remind);
  $('btnUndo').style.opacity = undoStack.length ? 1 : 0.4;
  $('btnPin').textContent = data.pin ? 'Hapus PIN' : 'Pasang PIN';

  const Q = data.cur === 'IDR' ? [10000, 50000, 100000] : data.cur === 'JPY' ? [1000, 5000, 10000] : [5, 10, 50];
  $('quick').innerHTML = '';
  Q.forEach(v => {
    const b = document.createElement('button');
    b.className = 'small'; b.textContent = '+' + fmt(v);
    b.onclick = () => { $('jumlah').value = bulat((parseFloat($('jumlah').value) || 0) + v); };
    $('quick').appendChild(b);
  });

  $('dots').innerHTML = '';
  TEMA.forEach(([k, col]) => {
    const b = document.createElement('button');
    b.className = 'dot' + (k === data.tema ? ' on' : '');
    b.style.background = col;
    b.onclick = () => { data.tema = k; simpan(); render(); };
    $('dots').appendChild(b);
  });

  const el = $('riwayat'); el.innerHTML = '';
  if (!c.log.length) { el.innerHTML = '<div class="muted">Belum ada transaksi.</div>'; cekBanner(); return; }
  c.log.map((x, i) => ({ x, i })).reverse().forEach(({ x, i }) => {
    const d = document.createElement('div'); d.className = 'item';
    const kiri = document.createElement('div'); kiri.className = 'kiri';
    kiri.innerHTML = '<div></div><div class="muted"></div>';
    kiri.children[0].textContent = x.catatan || (x.nominal > 0 ? 'Nabung' : 'Ambil');
    kiri.children[1].textContent = new Date(x.waktu).toLocaleString('id-ID');
    const kanan = document.createElement('div'); kanan.className = 'kanan';
    const nom = document.createElement('span');
    nom.className = x.nominal > 0 ? 'plus' : 'minus';
    nom.textContent = (x.nominal > 0 ? '+' : '−') + fmt(Math.abs(x.nominal));
    const h = document.createElement('button');
    h.className = 'small'; h.textContent = '✕'; h.onclick = () => hapus(i);
    kanan.append(nom, h); d.append(kiri, kanan); el.appendChild(d);
  });
  cekBanner();
}

function tambah(tanda) {
  const n = bulat(parseFloat($('jumlah').value));
  if (!n || n <= 0) return alert('Isi jumlah yang benar.');
  const c = C(), sebelum = hitung(c.log);
  if (tanda < 0 && n > sebelum) return alert('Saldo tidak cukup.');
  snap();
  c.log.push({ nominal: n * tanda, catatan: $('catatan').value.trim(), waktu: Date.now() });
  $('jumlah').value = ''; $('catatan').value = '';
  simpan(); render();
  toast(tanda > 0 ? 'Tabungan ditambahkan' : 'Uang diambil');
  if (tanda > 0) hujan(['🪙'], 10);
  const sesudah = sebelum + n * tanda;
  if (c.target > 0 && sebelum < c.target && sesudah >= c.target) setTimeout(() => hujan(['🎉', '✨', '🎊'], 36), 500);
}

function hapus(i) {
  if (!confirm('Hapus transaksi ini?')) return;
  const c = C(), sisa = c.log.filter((_, k) => k !== i);
  if (hitung(sisa) < -0.001) return alert('Tidak bisa dihapus: saldo akan jadi minus.');
  snap(); c.log = sisa; simpan(); render(); toast('Transaksi dihapus');
}

function setTarget() { snap(); C().target = parseFloat($('target').value) || 0; $('target').value = ''; simpan(); render(); }
function setNama() { data.nama = $('nama').value.trim().slice(0, 20); simpan(); render(); }
function setCur() { data.cur = $('cur').value; simpan(); tampil = 0; render(); }
function setRemind() { data.remind = parseInt($('remind').value, 10) || 0; bannerTutup = false; simpan(); render(); }

function reset() {
  if (!confirm('Kosongkan celengan ini? (Masih bisa diurungkan)')) return;
  snap(); C().log = []; C().target = 0; simpan(); render(); toast('Celengan dikosongkan');
}

function tambahCelengan() {
  const nama = prompt('Nama celengan (contoh: Liburan)');
  if (!nama || !nama.trim()) return;
  const em = prompt('Emoji (opsional)', '🎯') || '🎯';
  snap();
  data.celengan.push({ id: Date.now(), nama: nama.trim().slice(0, 16), emoji: Array.from(em.trim()).slice(0, 2).join('') || '🎯', target: 0, log: [] });
  data.aktif = data.celengan.length - 1; tampil = 0;
  simpan(); render(); toast('Celengan baru dibuat');
}

function ubahCelengan() {
  const c = C();
  const nama = prompt('Nama celengan', c.nama);
  if (!nama || !nama.trim()) return;
  const em = prompt('Emoji', c.emoji) || c.emoji;
  snap();
  c.nama = nama.trim().slice(0, 16);
  c.emoji = Array.from(em.trim()).slice(0, 2).join('') || c.emoji;
  simpan(); render();
}

function hapusCelengan() {
  if (data.celengan.length <= 1) return alert('Minimal harus ada satu celengan.');
  if (!confirm('Hapus celengan "' + C().nama + '" beserta riwayatnya? (Masih bisa diurungkan)')) return;
  snap(); data.celengan.splice(data.aktif, 1); data.aktif = 0; tampil = 0;
  simpan(); render(); toast('Celengan dihapus');
}

async function hash(p) {
  const s = 'nabungyuk:' + p;
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h = 5381;
  for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  return 'x' + h;
}

async function aturPin() {
  if (data.pin) {
    if (!confirm('Hapus PIN?')) return;
    data.pin = ''; simpan(); render(); return;
  }
  const p = prompt('PIN baru (4 angka)');
  if (!p) return;
  if (!/^\d{4}$/.test(p)) return alert('PIN harus 4 angka.');
  data.pin = await hash(p); simpan(); render(); alert('PIN dipasang.');
}

async function bukaKunci() {
  if (await hash($('pinIn').value) === data.pin) { $('lock').remove(); mulai(); }
  else { $('pinIn').value = ''; $('pinErr').textContent = 'PIN salah'; }
}

function ekspor() {
  const rest = Object.assign({}, data); delete rest.pin;
  const el = $('backup');
  el.value = JSON.stringify(rest);
  el.focus(); el.select();
  try { document.execCommand('copy'); } catch (e) {}
  alert('Kode backup sudah dibuat. Salin dan simpan di tempat aman.');
}

function impor() {
  try {
    const p = JSON.parse($('backup').value);
    let cel;
    const rapi = (c, i) => ({
      id: c.id || Date.now() + i,
      nama: String(c.nama || 'Utama').slice(0, 16),
      emoji: String(c.emoji || '🎯').slice(0, 4),
      target: Number(c.target) || 0,
      log: (Array.isArray(c.log) ? c.log : []).filter(valid)
    });
    if (p && Array.isArray(p.celengan)) cel = p.celengan.map(rapi);
    else if (p && Array.isArray(p.log)) cel = [rapi({ nama: 'Utama', emoji: '🐷', target: p.target, log: p.log }, 0)];
    else throw new Error('format');
    if (!cel.length) throw new Error('kosong');
    if (!confirm('Timpa data sekarang dengan data backup?')) return;
    snap();
    data.celengan = cel; data.aktif = 0; tampil = 0;
    if (TEMA.some(t => t[0] === p.tema)) data.tema = p.tema;
    if (CURS.includes(p.cur)) data.cur = p.cur;
    if ([0, 1, 7, 30].includes(p.remind)) data.remind = p.remind;
    data.nama = String(p.nama || '').slice(0, 20);
    simpan(); render(); $('backup').value = '';
    alert('Impor berhasil.');
  } catch (e) { alert('Kode backup tidak valid.'); }
}

function tutupSplash() { const s = $('splash'); if (!s) return; s.classList.add('hide'); setTimeout(() => s.remove(), 600); }

function mulai() {
  const jam = new Date().getHours();
  const w = jam < 11 ? 'pagi' : jam < 15 ? 'siang' : jam < 18 ? 'sore' : 'malam';
  $('salam').textContent = 'Selamat ' + w + (data.nama ? ', ' + data.nama : '') + '!';
  setTimeout(() => { if ($('splash')) hujan(['🪙'], 12); }, 300);
  setTimeout(tutupSplash, 3000);
}

render();
if (!data.pin) { $('lock').remove(); mulai(); }
</script>
